plugins { id 'maven-publish' }
dependencies {
    api 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    runtimeOnly project(':worker')
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation 'org.tukaani:xz:1.10'
}
evaluationDependsOn(':worker')
def toolVersion = project.version.toString()
def versionSources = layout.buildDirectory.dir('generated/sources/toolVersion/java/main')
tasks.register('generateToolVersion') {
    inputs.property('version', toolVersion)
    outputs.dir(versionSources)
    doLast {
        def source = new File(versionSources.get().asFile, 'io/github/rs0325/mcicon/internal/ToolVersion.java')
        source.parentFile.mkdirs()
        source.setText("""package io.github.rs0325.mcicon.internal;

public final class ToolVersion {
    private ToolVersion() {}
    public static final String VERSION = ${groovy.json.JsonOutput.toJson(toolVersion)};
}
""", 'UTF-8')
    }
}
sourceSets.main.java.srcDir(versionSources)
tasks.named('compileJava') { dependsOn 'generateToolVersion' }
tasks.named('sourcesJar') { dependsOn 'generateToolVersion' }
tasks.named('processResources') {
    from(rootProject.file('adapters')) { into 'adapters' }
}
publishing {
    publications {
        core(MavenPublication) {
            from components.java
            artifactId = 'mcicon-core'
            pom {
                name = 'MCIconGenerator Core'
                description = 'バニラMinecraftのテクスチャとインベントリアイコンを取得するJava API'
            }
        }
    }
}

def workerSources = layout.buildDirectory.dir('generated/sources/workerArtifact/java/main')
tasks.register('generateWorkerArtifactInfo') {
    dependsOn ':worker:agentJar'
    inputs.file(project(':worker').tasks.named('agentJar').flatMap { it.archiveFile })
    outputs.dir(workerSources)
    doLast {
        def hash = java.security.MessageDigest.getInstance('SHA-256').digest(project(':worker').tasks.named('agentJar').get().archiveFile.get().asFile.bytes).encodeHex().toString()
        def source = new File(workerSources.get().asFile, 'io/github/rs0325/mcicon/internal/WorkerArtifactInfo.java')
        source.parentFile.mkdirs()
        source.setText("""package io.github.rs0325.mcicon.internal;

final class WorkerArtifactInfo {
    private WorkerArtifactInfo() {}
    static final String SHA256 = "${hash}";
}
""", 'UTF-8')
    }
}
sourceSets.main.java.srcDir(workerSources)
tasks.named('compileJava') { dependsOn generateWorkerArtifactInfo }
tasks.named('sourcesJar') { dependsOn generateWorkerArtifactInfo }

// 生成器はcompiled classesだけで動かし、未生成resource/JARを参照しない。
def runtimeInput = providers.gradleProperty('managedRuntimeInputDir')
def runtimeResources = layout.buildDirectory.dir('generated/resources/managedRuntime')
tasks.register('generateManagedRuntimeResources', JavaExec) {
    classpath = files(sourceSets.main.output.classesDirs, configurations.compileClasspath)
    mainClass = 'io.github.rs0325.mcicon.internal.managed.RuntimeResourceGenerator'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    dependsOn 'compileJava', ':worker:agentJar'
    inputs.property('enabled', runtimeInput.isPresent())
    inputs.property('toolVersion', toolVersion)
    inputs.files(sourceSets.main.output.classesDirs, configurations.compileClasspath)
    if (runtimeInput.isPresent()) inputs.dir(rootProject.file(runtimeInput.get()))
    inputs.file(project(':worker').tasks.named('agentJar').flatMap { it.archiveFile })
    inputs.files(rootProject.file('adapters/legacy-mappings.json'), rootProject.file('adapters/releases.json'))
    outputs.dir(runtimeResources)
    doFirst {
        delete runtimeResources
        if (!runtimeInput.isPresent()) {
            runtimeResources.get().asFile.mkdirs()
            throw new StopExecutionException()
        }
        runtimeResources.get().asFile.parentFile.mkdirs()
        args rootProject.file(runtimeInput.get()), runtimeResources.get().asFile, toolVersion,
                project(':worker').tasks.named('agentJar').get().archiveFile.get().asFile, rootProject.projectDir
    }
}

tasks.named('processResources') {
    dependsOn 'generateManagedRuntimeResources'
    from(runtimeResources)
    doFirst {
        if (!fileTree('src/main/resources/META-INF/mcicon/runtime').isEmpty()) {
            throw new GradleException('runtime resourceは明示入力からだけ生成してください')
        }
        delete new File(destinationDir, 'META-INF/mcicon/runtime')
    }
}
