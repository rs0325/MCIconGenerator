plugins { id 'application' }
dependencies {
    testImplementation project(':cli')
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.3'
    implementation 'org.apache.commons:commons-compress:1.28.0'
}
application {
    mainClass = 'io.github.rs0325.mcicon.bootstrap.Main'
    applicationName = 'mcicon'
}
tasks.named('test') {
    systemProperty 'bootstrap.testClasspath', sourceSets.test.runtimeClasspath.asPath
    exclude '**/BackgroundPackageTest.class'
}
tasks.register('appImage', Exec) {
    dependsOn 'installDist'
    def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    doFirst {
        for (String property : ['bootstrapSeedDir', 'bootstrapTrustKey']) {
            if (!providers.gradleProperty(property).isPresent()) {
                throw new GradleException("明示した検証対象入力を-P${property}で指定してください")
            }
        }
        commandLine 'python3', file('scripts/package-bootstrap.py'),
                '--jdk', launcher.get().metadata.installationPath.asFile,
                '--input', new File(tasks.named('installDist').get().destinationDir, 'lib'),
                '--seed', file(providers.gradleProperty('bootstrapSeedDir').get()),
                '--trust', file(providers.gradleProperty('bootstrapTrustKey').get()),
                '--version', project.version.toString(), '--owner', 'archive',
                '--output', layout.buildDirectory.dir('app-image').get().asFile
        if (providers.gradleProperty('bootstrapManifestUrl').isPresent()) {
            args '--stable-manifest-url', providers.gradleProperty('bootstrapManifestUrl').get()
        }
    }
}

tasks.register('backgroundTest', Test) {
    dependsOn 'testClasses', 'installDist'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/BackgroundPackageTest.class'
    systemProperty 'bootstrap.testClasspath', sourceSets.test.runtimeClasspath.asPath
    systemProperty 'bootstrap.qaEvidenceRoot', layout.projectDirectory.dir('.local/background-evidence').asFile.absolutePath
    systemProperty 'bootstrap.distribution', layout.buildDirectory.dir('install/mcicon').get().asFile.absolutePath
}

tasks.register('verifyManagedRuntimePackage', JavaExec) {
    dependsOn 'compileJava', ':core:jar'
    classpath = files(sourceSets.main.output.classesDirs, configurations.compileClasspath)
    mainClass = 'io.github.rs0325.mcicon.bootstrap.ManagedPackageVerifier'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    doFirst {
        for (String property : ['managedRuntimeInputDir', 'bootstrapSeedDir', 'bootstrapTrustKey']) {
            if (!providers.gradleProperty(property).isPresent()) {
                throw new GradleException("正式packageには-P${property}の明示が必要です")
            }
        }
        args project(':core').layout.buildDirectory.dir('generated/resources/managedRuntime').get().asFile,
                file(providers.gradleProperty('bootstrapSeedDir').get()),
                file(providers.gradleProperty('bootstrapTrustKey').get()), project.version.toString(),
                project(':core').tasks.named('jar').get().archiveFile.get().asFile
    }
}
tasks.named('appImage') { mustRunAfter 'verifyManagedRuntimePackage' }
tasks.register('managedAppImage') {
    dependsOn 'verifyManagedRuntimePackage', 'appImage'
    description = '明示runtime resourcesと署名seedの同bytes検証後にMac app-imageを生成する'
}

tasks.register('homebrewArchive', Exec) {
    dependsOn 'installDist'
    description = '明示seedとtrustからHomebrew所有のJava同梱archive候補を生成する'
    def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    def output = layout.buildDirectory.dir('homebrew')
    doFirst {
        for (String property : ['bootstrapSeedDir', 'bootstrapTrustKey']) {
            if (!providers.gradleProperty(property).isPresent()) {
                throw new GradleException("明示した検証対象入力を-P${property}で指定してください")
            }
        }
        commandLine 'python3', file('scripts/package-bootstrap.py'),
                '--jdk', launcher.get().metadata.installationPath.asFile,
                '--input', new File(tasks.named('installDist').get().destinationDir, 'lib'),
                '--seed', file(providers.gradleProperty('bootstrapSeedDir').get()),
                '--trust', file(providers.gradleProperty('bootstrapTrustKey').get()),
                '--version', project.version.toString(), '--owner', 'homebrew',
                '--output', output.get().dir('app-image').asFile
        if (providers.gradleProperty('bootstrapManifestUrl').isPresent()) {
            args '--stable-manifest-url', providers.gradleProperty('bootstrapManifestUrl').get()
        }
    }
    doLast {
        providers.exec {
            commandLine 'python3', file('scripts/package-homebrew.py'), 'archive',
                    '--app-image', output.get().dir('app-image/image/MCIconBootstrap.app').asFile,
                    '--output', output.get().file("mcicon-bootstrap-${project.version}-macos.tar.gz").asFile
        }.result.get().assertNormalExitValue()
    }
}
tasks.named('homebrewArchive') { mustRunAfter 'verifyManagedRuntimePackage' }
tasks.register('managedHomebrewArchive') {
    dependsOn 'verifyManagedRuntimePackage', 'homebrewArchive'
    description = '正式runtime resourcesと署名seedの検証後にHomebrew archiveを生成する'
}
